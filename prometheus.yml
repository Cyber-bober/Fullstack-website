global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'nextjs'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['app:3000']
        labels:
          app: 'football'
  
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
        labels:
          app: 'redis'