name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql://football:football_pass@localhost:5432/football_db_test
  REDIS_URL: redis://localhost:6379
  NEXTAUTH_SECRET: test-secret-for-ci-minimum-32-chars-long
  NEXTAUTH_URL: http://localhost:3000
  INTERNAL_KEY: test-internal-key
  NODE_ENV: test
  POSTGRES_PASSWORD: football_pass

jobs:
  unit-tests:
    name: Unit Tests (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Unit Tests
        run: npm test --if-present

  python-tests:
    name: Python Tests (Pytest)
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: football
          POSTGRES_PASSWORD: football_pass
          POSTGRES_DB: football_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U football -d football_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.3.3 pytest-html==4.1.1 pytest-metadata==3.1.1 requests==2.32.3 jsonschema==4.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Verify migrations
        run: |
          echo "Checking if tables exist..."
          PGPASSWORD=football_pass psql -h localhost -U football -d football_db_test -c "\dt"

      - name: Seed test data
        run: npx prisma db seed
        continue-on-error: true

      - name: Build app
        run: npm run build

      - name: Start app in background
        run: |
          nohup npm start > app.log 2>&1 &
          echo $! > app.pid
          echo "App started with PID $(cat app.pid)"

      - name: Wait for app to be ready
        run: |
          echo "Waiting for app to be ready..."
          for i in {1..60}; do
            if curl -sf http://localhost:3000/api/teams > /dev/null 2>&1; then
              echo "App is ready after ${i}s"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 2
          done
          echo "App failed to start in 120s"
          echo "=== App logs ==="
          cat app.log
          exit 1

      - name: Run Python tests
        run: pytest tests/ -v --tb=short --html=report.html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: report.html

      - name: Stop app
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) 2>/dev/null || true
            rm -f app.pid
          fi
          # Убить все оставшиеся процессы Next.js
          pkill -f "next start" 2>/dev/null || true
          pkill -f "node server.js" 2>/dev/null || true
          sleep 2

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: football
          POSTGRES_PASSWORD: football_pass
          POSTGRES_DB: football_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U football -d football_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Seed test data
        run: npx prisma db seed
        continue-on-error: true

      - name: Build app
        run: npm run build

      - name: Start app in background
        run: |
          nohup npm start > app.log 2>&1 &
          echo $! > app.pid
          echo "App started with PID $(cat app.pid)"

      - name: Wait for app to be ready
        run: |
          echo "Waiting for app to be ready..."
          for i in {1..60}; do
            if curl -sf http://localhost:3000/api/teams > /dev/null 2>&1; then
              echo "App is ready after ${i}s"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 2
          done
          echo "App failed to start in 120s"
          echo "=== App logs ==="
          cat app.log
          exit 1

      - name: Run Playwright tests
        run: npx playwright test tests/e2e/ --project=chromium --project=firefox
        env:
          CI: true
          BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/

      - name: Stop app
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) 2>/dev/null || true
            rm -f app.pid
          fi
          pkill -f "next start" 2>/dev/null || true
          pkill -f "node server.js" 2>/dev/null || true
          sleep 2

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [unit-tests, python-tests, e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/football-app:latest
            ${{ secrets.DOCKER_USERNAME }}/football-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
